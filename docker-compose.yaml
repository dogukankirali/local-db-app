# docker-compose.yml
version: '3.8'

services:
  frontend:
    build: ./frontend
    container_name: local-db-app-fe
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
  backend:
    build: ./backend
    container_name: local-db-app-be
    ports:
      - "8080:8080"
    stdin_open: true
    tty: true