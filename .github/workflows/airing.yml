name: Yayın takibi

# #19 yedeği: asıl yayın takibi artık Worker'ın Cloudflare Cron Trigger'ında Kitsu ile çalışır
# (worker/src/airing.ts). Bu iş AniList'ten aynı güncellemeyi yapar ve yalnızca elle tetiklenir;
# yeni bölümde Kiroku içi ve tarayıcı bildirimi gider.
#
# Gerekli secret: KIROKU_CRON_SECRET (Worker'daki CRON_SECRET ile aynı).
# İsteğe bağlı: KIROKU_URL (repo variable), CF_ACCESS_CLIENT_ID / CF_ACCESS_CLIENT_SECRET (secret).

# Zamanlama şimdilik kapalı (#19); açmak için aşağıdaki schedule satırlarını geri ekle:
#   schedule:
#     - cron: "17 */3 * * *"
on:
  workflow_dispatch:

concurrency:
  group: airing
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: AniList'ten yayın bilgisini al ve Kiroku'ya yaz
        run: node worker/scripts/airing-check.mjs
        env:
          KIROKU_URL: ${{ vars.KIROKU_URL }}
          KIROKU_CRON_SECRET: ${{ secrets.KIROKU_CRON_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
